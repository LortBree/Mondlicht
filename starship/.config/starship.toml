add_newline = true
format = """
[󰣇 ](bold #adc6ff)$directory$git_branch$git_status$python$nodejs$rust$cmd_duration
$character"""

[character]
success_symbol = "[❯](bold #dce4f7)"
error_symbol = "[❯](bold #e07a8e)"

[directory]
style = "bold #adc6ff"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "#e07a8e"

[git_branch]
symbol = "󰘬 "
style = "bold #debcdf"
format = "on [$symbol$branch]($style) "

[git_status]
style = "#7e88a6"
format = "([$all_status$ahead_behind]($style) )"

[python]
symbol = " "
style = "#86c5a9"
format = "via [$symbol$version]($style) "

[nodejs]
symbol = " "
style = "#86c5a9"
format = "via [$symbol$version]($style) "

[rust]
symbol = " "
style = "#e2c285"
format = "via [$symbol$version]($style) "

[cmd_duration]
min_time = 1500
style = "#e2c285"
format = "took [$duration]($style) "
