source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.025
    contrast = 1.06
    brightness = 0.36
    vibrancy = 0.15
}

# Centered Clock & Date matching SDDM proportions
label {
    monitor =
    text = $TIME
    color = $luna_text
    font_size = 112
    font_family = Geist Light
    position = 0, 155
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $luna_muted
    font_size = 16
    font_family = Geist Medium
    position = 0, 74
    halign = center
    valign = center
}

# Circular Avatar Badge & Username matching SDDM
shape {
    monitor =
    size = 68, 68
    rounding = -1
    color = $obsidian_glass
    border_size = 1
    border_color = $accent
    position = 0, -24
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] printf '%s' "${USER:0:1}" | tr '[:lower:]' '[:upper:]'
    color = $luna_text
    font_size = 26
    font_family = Geist Medium
    position = 0, -24
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $luna_text
    font_size = 15
    font_family = Geist SemiBold
    position = 0, -76
    halign = center
    valign = center
}

# Rounded-rectangle password field (radius 8, parity with SDDM)
input-field {
    monitor =
    size = 244, 44
    outline_thickness = 1
    dots_size = 0.24
    dots_spacing = 0.30
    dots_center = true
    outer_color = $obsidian_rim
    inner_color = $obsidian_glass
    font_color = $luna_text
    fade_on_empty = false
    placeholder_text = <span foreground="##8b96b5">Password</span>
    hide_input = false
    rounding = 8
    check_color = $accent
    fail_color = $error_col
    fail_text = <i>Incorrect password ($ATTEMPTS)</i>
    position = 0, -134
    halign = center
    valign = center
}
