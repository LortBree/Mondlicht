general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 240
    on-timeout = sh -c 'command -v brightnessctl >/dev/null && ls /sys/class/backlight/* >/dev/null 2>&1 && brightnessctl -s set 15% || true'
    on-resume = sh -c 'command -v brightnessctl >/dev/null && ls /sys/class/backlight/* >/dev/null 2>&1 && brightnessctl -r || true'
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && sh -c 'command -v brightnessctl >/dev/null && ls /sys/class/backlight/* >/dev/null 2>&1 && brightnessctl -r || true'
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
